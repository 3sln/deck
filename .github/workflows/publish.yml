name: Release Deck

on:
  workflow_dispatch:
    inputs:
      use_npm_token:
        description: Use NPM_TOKEN instead of npm trusted publishing
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [package.json]

concurrency:
  group: deck-release
  queue: max

permissions:
  contents: read

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Check for a package version bump
        id: bump
        env:
          BEFORE: ${{ github.event.before }}
          TRIGGER: ${{ github.event_name }}
        run: |
          if [[ "$TRIGGER" == workflow_dispatch ]]; then
            bun -e '
              const {version} = await Bun.file("package.json").json();
              if (!/^[0-9A-Za-z.+-]+$/.test(version)) throw new Error("Invalid package version");
              console.log(`version=${version}`);
            ' >> "$GITHUB_OUTPUT"
          elif [[ "$BEFORE" == 0000000000000000000000000000000000000000 ]]; then
            exit 0
          else
            git show "$BEFORE:package.json" | bun -e '
              const previous = JSON.parse(await Bun.stdin.text()).version;
              const {version} = await Bun.file("package.json").json();
              if (!/^[0-9A-Za-z.+-]+$/.test(version)) throw new Error("Invalid package version");
              if (Bun.semver.order(version, previous) > 0) console.log(`version=${version}`);
            ' >> "$GITHUB_OUTPUT"
          fi
        shell: bash

  release:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
      - name: Verify the release tag
        run: |
          ref="refs/tags/v$VERSION"
          if git show-ref --verify --quiet "$ref" && [[ "$(git rev-parse "$ref^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag v$VERSION points to a different commit"
            exit 1
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun test
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ inputs.use_npm_token && secrets.NPM_TOKEN || '' }}
        run: |
          if [[ -n "$NODE_AUTH_TOKEN" ]]; then
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/deck-publish.npmrc"
            printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          fi
          pack_json="$RUNNER_TEMP/deck-pack.json"
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$pack_json"
          package=$(node -p 'require("./package.json").name')
          if published=$(npm view "$package@$VERSION" dist.integrity --json); then
            expected=$(node -p 'JSON.stringify(require(process.argv[1])[0].integrity)' "$pack_json")
            if [[ "$published" != "$expected" ]]; then
              echo "::error::$package@$VERSION exists on npm with different content"
              exit 1
            fi
          else
            tarball=$(node -p 'require(process.argv[1])[0].filename' "$pack_json")
            dist_tag=latest
            if [[ "${VERSION%%+*}" == *-* ]]; then dist_tag=next; fi
            npm publish "$RUNNER_TEMP/$tarball" --access public --provenance --tag "$dist_tag"
          fi
      - name: Publish GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          flags=(--target "$GITHUB_SHA")
          if [[ "${VERSION%%+*}" == *-* ]]; then flags+=(--prerelease); fi
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            if [[ "$draft" == true ]]; then gh release edit "$tag" --draft=false "${flags[@]}"; fi
          else
            gh release create "$tag" --title "$tag" --generate-notes "${flags[@]}"
          fi
          echo "Released $tag to GitHub and npm." >> "$GITHUB_STEP_SUMMARY"
